<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ARIA Remote : vue d'ensemble</title>
  <desc id="d">Le PC de contrôle (ARIA) et le PC distant (agent) se trouvent via le serveur de rendez-vous, puis échangent l'écran, la souris et le clavier directement en WebRTC. La page de téléchargement distribue l'agent compilé par GitHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#151b2b"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#60a5fa"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#34d399"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#8d99b0"/></marker>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" fill="#e8ecf4" font-size="28" font-weight="700">ARIA Remote</text>
  <text x="48" y="86" fill="#8d99b0" font-size="16">Prendre le contrôle d'un PC à distance, avec l'accord de son propriétaire</text>

  <!-- PC de contrôle -->
  <g>
    <rect x="48" y="130" width="300" height="300" rx="20" fill="#1c212c" stroke="#2f384a"/>
    <rect x="72" y="131" width="252" height="4" rx="2" fill="url(#acc)"/>
    <text x="72" y="172" fill="#e8ecf4" font-size="20" font-weight="700">PC de contrôle</text>
    <text x="72" y="195" fill="#8d99b0" font-size="14">celui qui commande</text>
    <rect x="72" y="214" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="88" y="240" fill="#60a5fa" font-size="14" font-weight="700">ui/</text>
    <text x="88" y="262" fill="#e8ecf4" font-size="15">Onglet « Maintenance</text>
    <text x="88" y="282" fill="#e8ecf4" font-size="15">à distance » d'ARIA</text>
    <rect x="72" y="312" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="88" y="338" fill="#60a5fa" font-size="14" font-weight="700">plugin/</text>
    <text x="88" y="360" fill="#e8ecf4" font-size="15">Appairage, sessions,</text>
    <text x="88" y="380" fill="#e8ecf4" font-size="15">permissions, signaling</text>
  </g>

  <!-- Serveur de rendez-vous -->
  <g>
    <rect x="450" y="130" width="300" height="300" rx="20" fill="#1c212c" stroke="#2f384a"/>
    <rect x="474" y="131" width="252" height="4" rx="2" fill="url(#acc)"/>
    <text x="474" y="172" fill="#e8ecf4" font-size="20" font-weight="700">Serveur de rendez-vous</text>
    <text x="474" y="195" fill="#8d99b0" font-size="14">sur Internet (ton VPS)</text>
    <rect x="474" y="214" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="490" y="240" fill="#60a5fa" font-size="14" font-weight="700">rendezvous/ · FastAPI</text>
    <text x="490" y="262" fill="#e8ecf4" font-size="15">Met les deux PC en relation :</text>
    <text x="490" y="282" fill="#e8ecf4" font-size="15">code à 6 chiffres, clés, signaling</text>
    <rect x="474" y="312" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="490" y="338" fill="#60a5fa" font-size="14" font-weight="700">coturn · STUN / TURN</text>
    <text x="490" y="360" fill="#e8ecf4" font-size="15">Aide à traverser box et pare-feu ;</text>
    <text x="490" y="380" fill="#e8ecf4" font-size="15">relais en dernier recours</text>
  </g>

  <!-- PC distant -->
  <g>
    <rect x="852" y="130" width="300" height="300" rx="20" fill="#1c212c" stroke="#2f384a"/>
    <rect x="876" y="131" width="252" height="4" rx="2" fill="url(#acc)"/>
    <text x="876" y="172" fill="#e8ecf4" font-size="20" font-weight="700">PC distant</text>
    <text x="876" y="195" fill="#8d99b0" font-size="14">celui qu'on contrôle</text>
    <rect x="876" y="214" width="252" height="184" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="892" y="240" fill="#60a5fa" font-size="14" font-weight="700">agent/ · remote-agent.exe</text>
    <text x="892" y="266" fill="#e8ecf4" font-size="15">• Fenêtre locale et code</text>
    <text x="892" y="288" fill="#e8ecf4" font-size="15">  d'appairage à 6 chiffres</text>
    <text x="892" y="314" fill="#e8ecf4" font-size="15">• Demande l'accord du</text>
    <text x="892" y="336" fill="#e8ecf4" font-size="15">  propriétaire à chaque fois</text>
    <text x="892" y="362" fill="#e8ecf4" font-size="15">• Capture l'écran, applique</text>
    <text x="892" y="384" fill="#e8ecf4" font-size="15">  souris et clavier</text>
  </g>

  <!-- liaisons signaling -->
  <path d="M348 250 H450" stroke="#60a5fa" stroke-width="3" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <path d="M750 250 H852" stroke="#60a5fa" stroke-width="3" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="399" y="238" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="801" y="238" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="399" y="276" fill="#8d99b0" font-size="12" text-anchor="middle">HTTPS</text>
  <text x="801" y="276" fill="#8d99b0" font-size="12" text-anchor="middle">WSS</text>

  <!-- lien direct WebRTC -->
  <path d="M198 430 V500 Q198 520 218 520 H982 Q1002 520 1002 500 V430" stroke="#34d399" stroke-width="4" fill="none" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <rect x="380" y="494" width="440" height="52" rx="26" fill="#14231f" stroke="#34d399"/>
  <text x="600" y="516" fill="#34d399" font-size="15" font-weight="700" text-anchor="middle">2 · Lien direct chiffré (WebRTC)</text>
  <text x="600" y="535" fill="#a8b3c7" font-size="12.5" text-anchor="middle">écran en image ↓ · souris et clavier ↑ · via TURN si besoin</text>

  <!-- distribution -->
  <text x="48" y="600" fill="#e8ecf4" font-size="18" font-weight="700">Comment l'agent arrive sur le PC distant</text>
  <g>
    <rect x="48" y="620" width="250" height="96" rx="14" fill="#1c212c" stroke="#2f384a"/>
    <text x="68" y="648" fill="#60a5fa" font-size="14" font-weight="700">GitHub · agent-vX.Y.Z</text>
    <text x="68" y="672" fill="#e8ecf4" font-size="14">Une étiquette lance la</text>
    <text x="68" y="692" fill="#e8ecf4" font-size="14">compilation sous Windows</text>
    <path d="M298 668 H350" stroke="#8d99b0" stroke-width="3" fill="none" marker-end="url(#am)"/>
    <rect x="350" y="620" width="250" height="96" rx="14" fill="#1c212c" stroke="#2f384a"/>
    <text x="370" y="648" fill="#60a5fa" font-size="14" font-weight="700">Release</text>
    <text x="370" y="672" fill="#e8ecf4" font-size="14">remote-agent.exe</text>
    <text x="370" y="692" fill="#e8ecf4" font-size="14">+ empreinte SHA-256</text>
    <path d="M600 668 H652" stroke="#8d99b0" stroke-width="3" fill="none" marker-end="url(#am)"/>
    <rect x="652" y="620" width="250" height="96" rx="14" fill="#1c212c" stroke="#2f384a"/>
    <text x="672" y="648" fill="#60a5fa" font-size="14" font-weight="700">download/ · processxen.com</text>
    <text x="672" y="672" fill="#e8ecf4" font-size="14">Page de téléchargement :</text>
    <text x="672" y="692" fill="#e8ecf4" font-size="14">dernière version + anciennes</text>
    <path d="M902 668 H954" stroke="#8d99b0" stroke-width="3" fill="none" marker-end="url(#am)"/>
    <rect x="954" y="620" width="198" height="96" rx="14" fill="#1c212c" stroke="#34d399"/>
    <text x="974" y="648" fill="#34d399" font-size="14" font-weight="700">PC distant</text>
    <text x="974" y="672" fill="#e8ecf4" font-size="14">On lance l'exe :</text>
    <text x="974" y="692" fill="#e8ecf4" font-size="14">le code s'affiche</text>
  </g>
</svg>
