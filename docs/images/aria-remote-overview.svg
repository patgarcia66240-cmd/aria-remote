<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ARIA Remote : vue d'ensemble</title>
  <desc id="d">Le PC de contrôle (bureau ou onglet ARIA) et le PC distant (agent) se trouvent via le serveur de rendez-vous, qui ne fait que relayer. Chaque session est signée des deux côtés : le contrôleur signe son offre, l'agent signe sa réponse et n'accepte qu'un contrôleur appairé. Ensuite, écran, souris et clavier passent directement en WebRTC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#151b2b"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#60a5fa"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#34d399"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#8d99b0"/></marker>
  </defs>
  <rect width="1200" height="900" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" fill="#e8ecf4" font-size="28" font-weight="700">ARIA Remote</text>
  <text x="48" y="86" fill="#8d99b0" font-size="16">Prendre le contrôle d'un PC à distance, avec l'accord de son propriétaire, signé des deux côtés</text>

  <!-- PC de contrôle -->
  <g>
    <rect x="48" y="130" width="300" height="380" rx="20" fill="#1c212c" stroke="#2f384a"/>
    <rect x="72" y="131" width="252" height="4" rx="2" fill="url(#acc)"/>
    <text x="72" y="172" fill="#e8ecf4" font-size="20" font-weight="700">PC de contrôle</text>
    <text x="72" y="195" fill="#8d99b0" font-size="14">celui qui commande</text>
    <rect x="72" y="214" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="88" y="240" fill="#60a5fa" font-size="14" font-weight="700">desktop/ · application</text>
    <text x="88" y="262" fill="#e8ecf4" font-size="15">Clé locale, signe les offres,</text>
    <text x="88" y="282" fill="#e8ecf4" font-size="15">épingle les appareils</text>
    <rect x="72" y="312" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="88" y="338" fill="#60a5fa" font-size="14" font-weight="700">ui/ · onglet ARIA</text>
    <text x="88" y="360" fill="#e8ecf4" font-size="15">Clé WebCrypto non extractible,</text>
    <text x="88" y="380" fill="#e8ecf4" font-size="15">mêmes règles que le bureau</text>
    <rect x="72" y="410" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="88" y="436" fill="#60a5fa" font-size="14" font-weight="700">plugin/ · ARIA</text>
    <text x="88" y="458" fill="#e8ecf4" font-size="15">Appairage, sessions,</text>
    <text x="88" y="478" fill="#e8ecf4" font-size="15">permissions, signatures</text>
  </g>

  <!-- Serveur de rendez-vous -->
  <g>
    <rect x="450" y="130" width="300" height="380" rx="20" fill="#1c212c" stroke="#2f384a"/>
    <rect x="474" y="131" width="252" height="4" rx="2" fill="url(#acc)"/>
    <text x="474" y="172" fill="#e8ecf4" font-size="20" font-weight="700">Serveur de rendez-vous</text>
    <text x="474" y="195" fill="#8d99b0" font-size="14">sur Internet (ton VPS)</text>
    <rect x="474" y="214" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="490" y="240" fill="#60a5fa" font-size="14" font-weight="700">rendezvous/ · FastAPI</text>
    <text x="490" y="262" fill="#e8ecf4" font-size="15">Met les deux PC en relation,</text>
    <text x="490" y="282" fill="#e8ecf4" font-size="15">relaie les offres et réponses</text>
    <rect x="474" y="312" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="490" y="338" fill="#60a5fa" font-size="14" font-weight="700">Ce qu'il ne peut pas faire</text>
    <text x="490" y="360" fill="#e8ecf4" font-size="15">Forger une signature, changer</text>
    <text x="490" y="380" fill="#e8ecf4" font-size="15">la clé d'un appareil appairé</text>
    <rect x="474" y="410" width="252" height="86" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="490" y="436" fill="#60a5fa" font-size="14" font-weight="700">coturn · STUN / TURN</text>
    <text x="490" y="458" fill="#e8ecf4" font-size="15">Traverse box et pare-feu ;</text>
    <text x="490" y="478" fill="#e8ecf4" font-size="15">relais en dernier recours</text>
  </g>

  <!-- PC distant -->
  <g>
    <rect x="852" y="130" width="300" height="380" rx="20" fill="#1c212c" stroke="#2f384a"/>
    <rect x="876" y="131" width="252" height="4" rx="2" fill="url(#acc)"/>
    <text x="876" y="172" fill="#e8ecf4" font-size="20" font-weight="700">PC distant</text>
    <text x="876" y="195" fill="#8d99b0" font-size="14">celui qu'on contrôle</text>
    <rect x="876" y="214" width="252" height="282" rx="12" fill="#232a37" stroke="#2f384a"/>
    <text x="892" y="240" fill="#60a5fa" font-size="14" font-weight="700">agent/ · remote-agent.exe</text>
    <text x="892" y="266" fill="#e8ecf4" font-size="14">• Code d'appairage à 6 chiffres</text>
    <text x="892" y="292" fill="#e8ecf4" font-size="14">• Accord du propriétaire,</text>
    <text x="892" y="312" fill="#e8ecf4" font-size="14">  à chaque session</text>
    <text x="892" y="338" fill="#34d399" font-size="14" font-weight="700">• Signe sa réponse avec sa clé</text>
    <text x="892" y="364" fill="#34d399" font-size="14" font-weight="700">• Refuse toute offre non signée</text>
    <text x="892" y="390" fill="#e8ecf4" font-size="14">• Capture écran, souris, clavier</text>
    <text x="892" y="416" fill="#8d99b0" font-size="13">Clé Ed25519 propre à l'appareil</text>
  </g>

  <!-- liaisons signaling -->
  <path d="M348 250 H450" stroke="#60a5fa" stroke-width="3" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <path d="M750 250 H852" stroke="#60a5fa" stroke-width="3" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="399" y="238" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="801" y="238" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="399" y="276" fill="#8d99b0" font-size="12" text-anchor="middle">HTTPS</text>
  <text x="801" y="276" fill="#8d99b0" font-size="12" text-anchor="middle">WSS</text>

  <!-- sécurité des sessions -->
  <text x="48" y="552" fill="#e8ecf4" font-size="18" font-weight="700">Chaque session est vérifiée des deux côtés</text>
  <g>
    <rect x="48" y="570" width="340" height="150" rx="14" fill="#1c212c" stroke="#2f384a"/>
    <text x="68" y="598" fill="#60a5fa" font-size="14" font-weight="700">1 · Offre signée</text>
    <text x="68" y="624" fill="#e8ecf4" font-size="14">Le contrôleur signe son offre avec sa</text>
    <text x="68" y="644" fill="#e8ecf4" font-size="14">clé. L'agent n'écoute qu'une offre signée</text>
    <text x="68" y="664" fill="#e8ecf4" font-size="14">par un contrôleur accepté à l'appairage.</text>
    <path d="M388 645 H430" stroke="#8d99b0" stroke-width="3" fill="none" marker-end="url(#am)"/>
    <rect x="430" y="570" width="340" height="150" rx="14" fill="#1c212c" stroke="#2f384a"/>
    <text x="450" y="598" fill="#60a5fa" font-size="14" font-weight="700">2 · Réponse signée</text>
    <text x="450" y="624" fill="#e8ecf4" font-size="14">L'agent signe sa réponse. Le contrôleur</text>
    <text x="450" y="644" fill="#e8ecf4" font-size="14">n'accepte que la clé épinglée de cet</text>
    <text x="450" y="664" fill="#e8ecf4" font-size="14">appareil : le serveur ne peut pas la changer.</text>
    <path d="M770 645 H812" stroke="#8d99b0" stroke-width="3" fill="none" marker-end="url(#am)"/>
    <rect x="812" y="570" width="340" height="150" rx="14" fill="#14231f" stroke="#34d399"/>
    <text x="832" y="598" fill="#34d399" font-size="14" font-weight="700">3 · Lien direct chiffré (WebRTC)</text>
    <text x="832" y="624" fill="#e8ecf4" font-size="14">Écran en image ↓ · souris et clavier ↑</text>
    <text x="832" y="646" fill="#a8b3c7" font-size="13">Relais TURN seulement si le lien direct</text>
    <text x="832" y="664" fill="#a8b3c7" font-size="13">ne passe pas. Chaque session est acceptée</text>
    <text x="832" y="682" fill="#a8b3c7" font-size="13">par la personne devant le PC distant.</text>
  </g>

  <!-- distribution -->
  <text x="48" y="800" fill="#e8ecf4" font-size="18" font-weight="700">Comment l'agent arrive sur le PC distant</text>
  <g>
    <rect x="48" y="818" width="250" height="66" rx="14" fill="#1c212c" stroke="#2f384a"/>
    <text x="68" y="842" fill="#60a5fa" font-size="14" font-weight="700">GitHub · agent-vX.Y.Z</text>
    <text x="68" y="866" fill="#e8ecf4" font-size="14">Une étiquette lance le build</text>
    <path d="M298 851 H350" stroke="#8d99b0" stroke-width="3" fill="none" marker-end="url(#am)"/>
    <rect x="350" y="818" width="250" height="66" rx="14" fill="#1c212c" stroke="#2f384a"/>
    <text x="370" y="842" fill="#60a5fa" font-size="14" font-weight="700">Release</text>
    <text x="370" y="866" fill="#e8ecf4" font-size="14">remote-agent.exe + SHA-256</text>
    <path d="M600 851 H652" stroke="#8d99b0" stroke-width="3" fill="none" marker-end="url(#am)"/>
    <rect x="652" y="818" width="250" height="66" rx="14" fill="#1c212c" stroke="#2f384a"/>
    <text x="672" y="842" fill="#60a5fa" font-size="14" font-weight="700">download/ · téléchargement</text>
    <text x="672" y="866" fill="#e8ecf4" font-size="14">Dernière version + anciennes</text>
    <path d="M902 851 H954" stroke="#8d99b0" stroke-width="3" fill="none" marker-end="url(#am)"/>
    <rect x="954" y="818" width="198" height="66" rx="14" fill="#1c212c" stroke="#34d399"/>
    <text x="974" y="842" fill="#34d399" font-size="14" font-weight="700">PC distant</text>
    <text x="974" y="866" fill="#e8ecf4" font-size="14">On lance l'exe</text>
  </g>
</svg>
