# Compile l'agent Remote pour Windows et publie remote-agent.exe.
#   - À chaque changement de remote-agent/ : tests + compilation sous Windows (l'exe est gardé 30 jours comme « artefact » de l'exécution).
#   - Avec une étiquette « agent-vX.Y.Z » (git tag agent-v0.1.0 && git push origin agent-v0.1.0) : l'exe et son empreinte SHA-256 sont
#     joints à une version (Release) du dépôt, d'où la page de téléchargement les récupère.
#   - À la main : onglet Actions › « Agent Windows » › Run workflow.
name: Agent Windows

on:
  push:
    branches: [chore/frontend-audit-p1, main]
    paths: ['remote-agent/**', '.github/workflows/build-agent.yml']
    tags: ['agent-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # Signature (facultative) : renseigne ces secrets dans GitHub › Settings › Secrets and variables › Actions pour que l'exe sorte SIGNÉ.
    #   WINDOWS_CERT_PFX_BASE64 : le certificat de signature de code (.pfx), encodé en base64
    #   WINDOWS_CERT_PASSWORD   : son mot de passe
    # Sans ces secrets, l'exe est produit non signé (SmartScreen affichera « Éditeur inconnu »). Voir remote-agent/README.md.
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    defaults:
      run:
        working-directory: remote-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote-agent

      # Les tests tournent AUSSI sous Windows : c'est là que la vraie saisie (enigo), la capture (xcap) et la boîte de dialogue (rfd) sont compilées.
      # En mode release : la compilation est réutilisée par l'étape suivante (au lieu d'être faite deux fois). Sur une étiquette de version, les tests ont déjà
      # tourné sur la branche : on ne les refait pas, seule la compilation de l'exe est nécessaire.
      # Une seule source de vérité : la version du Cargo.toml. L'étiquette agent-vX.Y.Z doit la reproduire à l'identique, sinon on s'arrête
      # (l'exe afficherait un numéro, la page et la version du dépôt un autre).
      - name: Version de l'étiquette = version de l'exe
        if: ${{ startsWith(github.ref, 'refs/tags/agent-v') }}
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "${env:GITHUB_REF_NAME}".Substring('agent-v'.Length)
          if ($cargo -ne $tag) { throw "L'étiquette ($tag) ne correspond pas à la version de Cargo.toml ($cargo) : change la version, puis recrée l'étiquette." }
          Write-Host "Version $cargo"

      - name: Tests
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo test --release --locked

      - name: Compilation (release)
        run: cargo build --release --locked

      # La signature se fait AVANT l'empreinte : l'empreinte publiée est celle du fichier signé.
      - name: Signature de l'exe
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signature.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD target/release/remote-agent.exe
          if ($LASTEXITCODE -ne 0) { throw "La signature a échoué" }
          & $signtool verify /pa /v target/release/remote-agent.exe
          if ($LASTEXITCODE -ne 0) { throw "La signature n'est pas valide" }
          Remove-Item $pfx -Force
          "### Signature`nL'exe est signé." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Signature absente
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 == '' }}
        shell: pwsh
        run: |
          Write-Host "Aucun certificat configuré : l'exe est produit non signé."
          "### Signature`nExe NON signé (aucun certificat configuré)." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/remote-agent.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  remote-agent.exe" | Out-File -Encoding ascii target/release/remote-agent.exe.sha256
          Write-Host "SHA-256 : $hash"
          "### remote-agent.exe`nSHA-256 : ``$hash``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: remote-agent-windows
          path: |
            remote-agent/target/release/remote-agent.exe
            remote-agent/target/release/remote-agent.exe.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    # Seulement pour une étiquette agent-v* : l'exe compilé plus haut devient téléchargeable depuis la version du dépôt.
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: remote-agent-windows
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" remote-agent.exe remote-agent.exe.sha256 \
            --repo "${GITHUB_REPOSITORY}" --title "Agent Remote ${GITHUB_REF_NAME#agent-v}" \
            --notes "Agent Remote pour Windows 64 bits. Empreinte SHA-256 dans remote-agent.exe.sha256." --verify-tag
