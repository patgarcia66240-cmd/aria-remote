# Lance les tests du plugin Remote et du serveur de rendez-vous (plugin/run-tests.sh).
#   - À chaque changement de plugin/, de rendezvous/ ou de ce workflow.
name: Plugin tests

on:
  push:
    branches: [main]
    paths: ['plugin/**', 'rendezvous/**', '.github/workflows/plugin-tests.yml']
  pull_request:
    paths: ['plugin/**', 'rendezvous/**', '.github/workflows/plugin-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r rendezvous/requirements.txt pytest

      - name: Lancer les tests du plugin
        run: sh plugin/run-tests.sh
