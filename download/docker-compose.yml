# Page de téléchargement de l'agent sur un serveur qui a DÉJÀ un Traefik (modèle « Ubuntu avec n8n » de Hostinger).
# La page se met à jour toute seule (toutes les REFRESH_SECONDS) : il suffit de publier une version sur GitHub. Dépôt public : aucun jeton.
# Variables facultatives (fichier .env ou « Environment » du projet) : SITE_HOST (par défaut processxen.com), REFRESH_SECONDS (par défaut 600).
services:
  download:
    build:
      context: https://github.com/patgarcia66240-cmd/aria-remote.git#main:download
    image: pc-download:auto
    environment:
      REFRESH_SECONDS: ${REFRESH_SECONDS:-600}
    volumes:
      - download-cache:/srv/cache
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-n8n_default}
      - traefik.http.routers.pc-download.rule=Host(`${SITE_HOST:-processxen.com}`) || Host(`www.${SITE_HOST:-processxen.com}`)
      - traefik.http.routers.pc-download.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.pc-download.tls=true
      - traefik.http.routers.pc-download.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-mytlschallenge}
      - traefik.http.services.pc-download.loadbalancer.server.port=80
      # xendev.eu/remote : même page, servie sous /remote/ (le préfixe est retiré avant nginx). Pas de redirection vers processxen.com.
      - traefik.http.routers.pc-download-xendev.rule=Host(`xendev.eu`) && PathPrefix(`/remote`)
      - traefik.http.routers.pc-download-xendev.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.pc-download-xendev.tls=true
      - traefik.http.routers.pc-download-xendev.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-mytlschallenge}
      - traefik.http.routers.pc-download-xendev.service=pc-download
      - traefik.http.routers.pc-download-xendev.middlewares=pc-download-slash,pc-download-strip
      - traefik.http.middlewares.pc-download-slash.redirectregex.regex=^https://xendev\.eu/remote$$
      - traefik.http.middlewares.pc-download-slash.redirectregex.replacement=https://xendev.eu/remote/
      - traefik.http.middlewares.pc-download-slash.redirectregex.permanent=false
      - traefik.http.middlewares.pc-download-strip.stripprefix.prefixes=/remote

volumes:
  download-cache:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-n8n_default}
