server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /remote-agent.exe {
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="remote-agent.exe"' always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /remote-agent.exe.sha256 { default_type text/plain; }
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri $uri/ =404; }
}
