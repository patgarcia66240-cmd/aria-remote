<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIA Remote</title>
<style>
  :root { --bg:#14171f; --panel:#1c212c; --line:#2f384a; --text:#e8ecf4; --muted:#8d99b0; --accent:#3b82f6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .card { max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 6px 0 0; color: var(--muted); }
  .ver { display: inline-block; margin-top: 14px; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #60a5fa; background: rgba(59,130,246,.14); border: 1px solid rgba(59,130,246,.35); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>ARIA Remote</h1>
    <p>Application de contrôle à distance.</p>
    <p>Squelette prêt : appareils, appairage et écran distant arrivent ensuite.</p>
    <span class="ver" id="ver" hidden></span>
  </div>
</main>
<script>
  // Hors de la fenêtre Tauri (aperçu dans un navigateur), l'API n'existe pas : on n'affiche simplement pas la version.
  const invoke = window.__TAURI__?.core?.invoke
  if (invoke) invoke('app_version').then((v) => { const el = document.getElementById('ver'); el.textContent = 'v' + v; el.hidden = false }).catch(() => {})
</script>
</body>
</html>
