# Variante « sans SSH » pour le VPS Hostinger (modèle Ubuntu avec n8n et Traefik), déployable depuis hPanel (Docker › Compose) ou l'API Hostinger.
# En DEUX temps, car l'interface Docker de Hostinger ne construit pas d'image à partir d'un dépôt :
#   1) projet « pc-rendezvous-build » (docker-compose.hostinger-build.yml) : un conteneur éphémère construit l'image « pc-rendezvous:local » sur le VPS ;
#   2) projet « pc-rendezvous » (CE fichier) : démarre cette image + le relais coturn.
# Variables : DOMAIN, RENDEZVOUS_AGENT_KEY, RENDEZVOUS_CONTROLLER_KEY, TURN_SECRET ; Traefik (valeurs du modèle n8n) : TRAEFIK_NETWORK=n8n_default,
# TRAEFIK_ENTRYPOINT=websecure, TRAEFIK_CERT_RESOLVER=mytlschallenge. Pour mettre à jour : relancer le projet 1 puis redémarrer le projet 2.
services:
  rendezvous:
    image: pc-rendezvous:local
    pull_policy: never
    restart: unless-stopped
    environment:
      RENDEZVOUS_AGENT_KEY: ${RENDEZVOUS_AGENT_KEY:?manquant}
      RENDEZVOUS_CONTROLLER_KEY: ${RENDEZVOUS_CONTROLLER_KEY:?manquant}
      REMOTE_STUN_URLS: stun:${DOMAIN:?manquant}:3478
      REMOTE_TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      REMOTE_TURN_SECRET: ${TURN_SECRET:?manquant}
      REMOTE_PAIRING_CODE_TTL: ${PAIRING_CODE_TTL:-1800}
      REMOTE_PAIR_RATE_LIMIT: ${PAIR_RATE_LIMIT:-10}
    volumes:
      - rendezvous-data:/app/backend/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-n8n_default}
      - traefik.http.routers.pc-rendezvous.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.pc-rendezvous.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.pc-rendezvous.tls=true
      - traefik.http.routers.pc-rendezvous.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-mytlschallenge}
      - traefik.http.services.pc-rendezvous.loadbalancer.server.port=8080

  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --listening-port=3478
      --min-port=49152 --max-port=65535
      --fingerprint
      --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --realm=${DOMAIN}
      --no-tls
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-n8n_default}

volumes:
  rendezvous-data:
