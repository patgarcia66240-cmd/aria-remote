# Variante pour un serveur qui a DÉJÀ un Traefik sur les ports 80/443 (c'est le cas du modèle « Ubuntu avec n8n » de Hostinger) : au lieu d'un second
# proxy HTTPS (Caddy) qui entrerait en conflit, le serveur de rendez-vous se déclare auprès de Traefik par des étiquettes. Traefik, déjà en place,
# obtient le certificat et route https://DOMAIN vers ce service ; rien n'est modifié dans le projet existant (n8n, etc.).
# install-vps.sh choisit ce fichier tout seul quand il détecte Traefik et en lit les réglages (réseau, résolveur de certificats, point d'entrée).
#   docker compose -f docker-compose.traefik.yml up -d --build
services:
  rendezvous:
    build:
      context: ..
      dockerfile: remote-rendezvous/Dockerfile
    restart: unless-stopped
    environment:
      RENDEZVOUS_AGENT_KEY: ${RENDEZVOUS_AGENT_KEY:?Définis RENDEZVOUS_AGENT_KEY dans .env}
      RENDEZVOUS_CONTROLLER_KEY: ${RENDEZVOUS_CONTROLLER_KEY:?Définis RENDEZVOUS_CONTROLLER_KEY dans .env}
      REMOTE_STUN_URLS: stun:${DOMAIN:?Définis DOMAIN dans .env}:3478
      REMOTE_TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      REMOTE_TURN_SECRET: ${TURN_SECRET:?Définis TURN_SECRET dans .env}
      REMOTE_PAIRING_CODE_TTL: ${PAIRING_CODE_TTL:-1800}
      REMOTE_PAIR_RATE_LIMIT: ${PAIR_RATE_LIMIT:-10}
    volumes:
      - rendezvous-data:/app/backend/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-n8n_default}
      - traefik.http.routers.pc-rendezvous.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.pc-rendezvous.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.pc-rendezvous.tls=true
      - traefik.http.routers.pc-rendezvous.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-mytlschallenge}
      - traefik.http.services.pc-rendezvous.loadbalancer.server.port=8080

  # Relais réseau (voir docker-compose.yml). Ports 3478 et 49152-65535 en UDP : libres sur un serveur n8n standard.
  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --listening-port=3478
      --min-port=49152 --max-port=65535
      --fingerprint
      --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --realm=${DOMAIN}
      --no-tls
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-n8n_default}

volumes:
  rendezvous-data:
