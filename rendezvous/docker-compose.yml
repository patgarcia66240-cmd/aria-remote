# Serveur de rendez-vous + TLS (Caddy) + relais (coturn). Mode d'emploi : README.md
#   cp .env.example .env   # puis remplir DOMAIN et les trois secrets
#   docker compose up -d --build
services:
  rendezvous:
    build:
      context: ..
      dockerfile: remote-rendezvous/Dockerfile
    restart: unless-stopped
    environment:
      RENDEZVOUS_AGENT_KEY: ${RENDEZVOUS_AGENT_KEY:?Définis RENDEZVOUS_AGENT_KEY dans .env}
      RENDEZVOUS_CONTROLLER_KEY: ${RENDEZVOUS_CONTROLLER_KEY:?Définis RENDEZVOUS_CONTROLLER_KEY dans .env}
      # Relais : l'agent et le navigateur reçoivent ces serveurs à chaque session (identifiants coturn éphémères dérivés de TURN_SECRET).
      REMOTE_STUN_URLS: stun:${DOMAIN:?Définis DOMAIN dans .env}:3478
      REMOTE_TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      REMOTE_TURN_SECRET: ${TURN_SECRET:?Définis TURN_SECRET dans .env}
      REMOTE_PAIRING_CODE_TTL: ${PAIRING_CODE_TTL:-1800}
      REMOTE_PAIR_RATE_LIMIT: ${PAIR_RATE_LIMIT:-10}
    volumes:
      - rendezvous-data:/app/backend/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - rendezvous
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"     # certificat Let's Encrypt
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  # Relais réseau pour les connexions qui ne peuvent pas être directes. network_mode: host : coturn ouvre une grande plage de ports UDP.
  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --listening-port=3478
      --min-port=49152 --max-port=65535
      --fingerprint
      --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --realm=${DOMAIN}
      --no-cli --no-tls --no-dtls
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      # Serveur derrière un NAT (IP publique différente de celle de la machine) : ajoute  --external-ip=<IP publique>

volumes:
  rendezvous-data:
  caddy-data:
