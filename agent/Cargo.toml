[package]
name = "remote-agent"
version = "0.1.4"
edition = "2021"
description = "Agent Remote de PC Assistant : capture écran, souris, clavier et WebRTC (voir docs/REMOTE_ARCHITECTURE.md)"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.14"

# Capture, saisie et fenêtre de consentement natives : Windows seulement (ailleurs, source synthétique et saisie journalisée,
# ce qui permet de développer et tester sans écran).
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
enigo = "0.6"
rfd = "0.15"
xcap = "0.9"

# Identité de l'exe Windows (icône, éditeur, description, version) : voir build.rs. Compilée seulement quand on construit SOUS Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Compilation rapide d'abord : « lto = true » + « codegen-units = 1 » rendaient l'étape finale (368/369) très longue et gourmande en mémoire avec
# webrtc, pour un gain de vitesse négligeable ici (le travail lourd est le JPEG, déjà optimisé). Les dépendances sont optimisées même en dev,
# sinon l'encodage JPEG y est trop lent pour un flux fluide.
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true

[profile.dev.package."*"]
opt-level = 2
