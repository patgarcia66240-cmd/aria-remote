server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # La page n'appelle que son propre domaine : tout le reste est refusé par le navigateur.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Page de téléchargement d'ARIA Remote : servie par le projet « pc-download » sous processxen.com.
    # Redirection provisoire, à retirer quand ce projet acceptera aussi xendev.eu (routeur Traefik).
    location = /remote { return 302 https://processxen.com/remote/; }
    location /remote/ { return 302 https://processxen.com$request_uri; }

    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
